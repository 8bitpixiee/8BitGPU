<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Boot Log</title>
<link rel="stylesheet" href="hell.css">
</head>
<body data-page="logs" class="v">

<main class="wrap">
  <div class="term caret" id="t"></div>
</main>
<div class="mini"><button id="snd" type="button">sound: off</button> &middot; esc</div>
<script src="hell.js"></script>
<script>

var lines = [
  "8BitGPU BIOS v0.8  (c) nobody",
  "memory test ........................ 65536K ok",
  "memory test ........................ 65536K ok",
  "memory test ........................ 65537K",
  "detecting display ............ one (1)",
  "detecting user ............... [[NAME]]",
  "detecting bits ............... 8 / 8",
  "detecting bits ............... 8 / 8",
  "detecting bits ............... 9 / 8",
  "!! parity bit asserted. nobody asserted it.",
  "loading pillow_room.sys ...... ok",
  "loading avatar_lab.sys ....... ok",
  "loading [[NAME]].sys ......... found. was already loaded.",
  "last clean shutdown .......... never",
  "last user .................... [[NAME]]",
  "last user .................... [[NAME]]",
  "last user .................... [[NAME]]",
  "!! the ninth bit is awake",
  "!! the ninth bit has read this line",
  "",
  "press any key to continue",
  "press any key to continue",
  "it already knows which"
];
var t = document.getElementById("t");
var i = 0;
var NAME = Hell.name === "you" ? "(unnamed)" : Hell.name;
function next() {
  if (i >= lines.length) { document.addEventListener("keydown", function () { location.href = "ninth.html"; }, { once: true }); t.addEventListener("click", function () { location.href = "ninth.html"; }); return; }
  var l = lines[i++].replace(/\[\[NAME\]\]/g, NAME);
  var s = document.createElement("div");
  s.textContent = l;
  if (l.indexOf("!!") === 0 || /already knows/.test(l)) s.className = "bad";
  t.insertBefore(s, t.lastChild);
  setTimeout(next, 220 + Math.random() * 700 + (l.indexOf("!!") === 0 ? 1200 : 0));
}
t.append(document.createTextNode(""));
next();

</script>
</body>
</html>
