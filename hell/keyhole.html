<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>THE KEYHOLE</title>
<link rel="stylesheet" href="hell.css">
</head>
<body data-page="keyhole" data-calm class="v">

<style>body.v::before{display:none}</style>
<main class="wrap" style="text-align:center">
  <h1 style="letter-spacing:.4em">THE KEYHOLE</h1>
  <div id="slots" style="margin:26px auto;max-width:640px;text-align:left"></div>
  <p><input id="say" type="text" autocomplete="off" spellcheck="false" placeholder="say the word" style="max-width:320px;text-align:center"> <button id="go" type="button" style="background:none;border:1px solid #6d5a48;color:#c9a35c;padding:9px 16px;cursor:pointer;font:inherit">say it</button></p>
  <p id="out" class="dim nolink" style="min-height:2em"></p>
  <p id="turn" hidden><a href="bottom.html" style="font-size:26px;letter-spacing:.2em">THE NINTH KEY TURNS</a></p>
</main>
<div class="mini"><button id="snd" type="button">sound: off</button> &middot; esc</div>
<script src="hell.js"></script>
<script>

(function () {
  var riddles = [
    "the first word is hidden where the letter ends.",
    "the second is in the door's bones. read it the way it reads you.",
    "the third is spoken in ones and zeros by a face that holds still.",
    "the fourth is the ninth thing you close.",
    "the fifth is in the room that is not zero and not the one you know: the number written twice. come to it in order.",
    "the sixth is the smallest name on the cube's calculator.",
    "the seventh is in the creed. read it down.",
    "the eighth is what the mirror says when it finishes you.",
    "the ninth waits in the elevator, for a hand that presses open, and open, and open."
  ];
  var holder = document.getElementById("slots");
  function draw() {
    holder.innerHTML = "";
    var n = 0;
    for (var i = 0; i < 9; i++) {
      var d = document.createElement("div");
      d.style.cssText = "margin:0 0 14px;padding:10px 14px;border-left:3px solid " + (Hell.S.keys[i] ? "#c21" : "#3a2a1a") + ";background:#0a0706";
      var w = Hell.S.keys[i];
      var b = document.createElement("b");
      b.style.cssText = "letter-spacing:.3em;font-size:22px;display:block";
      b.textContent = (i + 1) + "  " + (w ? w.toUpperCase() : "_ _ _ _ _ _".slice(0, Hell.KEYLEN[i] * 2 - 1));
      if (w) n++;
      var s = document.createElement("small");
      s.textContent = w ? "" : riddles[i];
      d.append(b, s);
      holder.append(d);
    }
    document.getElementById("turn").hidden = n < 9;
    var f = Hell.allowedFloor(n);
    document.getElementById("out").textContent = n + " of 9 turned. floors open: 1 to " + f + ".";
  }
  draw();
  function say() {
    var el = document.getElementById("say");
    var v = el.value.trim();
    el.value = "";
    if (!v) return;
    var i = Hell.keyAdd(v);
    draw();
    var out = document.getElementById("out");
    if (i >= 0) { out.textContent = "key " + (i + 1) + " turns. " + out.textContent; Hell.whisper("that was number " + (i + 1)); }
    else out.textContent = ["not that.", "the keyhole does not know that word.", "it listened. it is not that.", "no."][Hell.rint(4)] + " " + out.textContent;
  }
  document.getElementById("go").addEventListener("click", say);
  document.getElementById("say").addEventListener("keydown", function (e) { if (e.key === "Enter") say(); });
})();

</script>
</body>
</html>
