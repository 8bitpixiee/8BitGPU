<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>256 Doors</title>
<link rel="stylesheet" href="hell.css">
</head>
<body data-page="doors" data-calm class="v">

<main class="wrap wide">
  <h1 class="center">256 Doors</h1>
  <div class="doorgrid" id="grid"></div>
  <p class="center"><small>there is no door 666. several people have looked.</small></p>
</main>
<div class="mini"><button id="snd" type="button">sound: off</button> &middot; esc</div>
<script src="hell.js"></script>
<script>

var grid = document.getElementById("grid");
var done = {};
try { done = JSON.parse(localStorage.getItem("8bitgpu-hell-doors") || "{}"); } catch (e) { done = {}; }
for (var n = 0; n < 256; n++) {
  var a = document.createElement("a");
  a.href = "room.html?n=" + n;
  a.textContent = n.toString(16).toUpperCase().padStart(2, "0");
  if (n === 0) a.className = "zero";
  if (done[n]) a.className = "seen";
  grid.append(a);
}
</script>
</body>
</html>
