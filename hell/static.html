<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Static</title>
<link rel="stylesheet" href="hell.css">
</head>
<body data-page="static" data-calm class="v">

<main class="wrap wide">
  <h1 class="center">Static</h1>
  <canvas class="pix" id="tv" width="160" height="100" style="max-width:800px;margin:0 auto"></canvas>
  <p class="center dim" id="cap">&nbsp;</p>
</main>
<div class="mini"><button id="snd" type="button">sound: off</button> &middot; esc</div>
<script src="hell.js"></script>
<script>

var c = document.getElementById("tv");
var g = c.getContext("2d");
var W = c.width, H = c.height;
var mask = document.createElement("canvas");
mask.width = W; mask.height = H;
var m = mask.getContext("2d");
m.fillStyle = "#000"; m.fillRect(0, 0, W, H);
m.fillStyle = "#777"; m.beginPath(); m.ellipse(80, 52, 30, 40, 0, 0, 7); m.fill();
m.fillStyle = "#111"; m.beginPath(); m.ellipse(68, 44, 7, 9, 0, 0, 7); m.fill(); m.beginPath(); m.ellipse(92, 44, 7, 9, 0, 0, 7); m.fill();
m.fillStyle = "#222"; m.beginPath(); m.ellipse(80, 72, 9, 14, 0, 0, 7); m.fill();
m.fillStyle = "#555"; m.fillRect(79, 54, 3, 10);
var face = m.getImageData(0, 0, W, H).data;
var reveal = 0, still = 0, blinked = false, last = Date.now();
document.addEventListener("mousemove", function () { still = 0; });
document.addEventListener("visibilitychange", function () { if (document.hidden) blinked = true; });
var img = g.createImageData(W, H);
function frame() {
  still++;
  reveal = Math.min(.9, still > 120 ? reveal + .004 : Math.max(0, reveal - .03));
  for (var i = 0; i < W * H; i++) {
    var v = Math.random() * 255;
    var f = face[i * 4];
    var o = v * (1 - reveal) + f * reveal * (.8 + Math.random() * .4);
    img.data[i * 4] = o; img.data[i * 4 + 1] = o; img.data[i * 4 + 2] = o; img.data[i * 4 + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  if (reveal > .55) {
    var open = blinked || reveal > .8;
    if (open) { g.fillStyle = "#fff"; g.fillRect(65, 43, 4, 3); g.fillRect(89, 43, 4, 3); }
  }
  var cap = document.getElementById("cap");
  if (reveal > .3) cap.textContent = "it is nearly done being you.";
  if (reveal > .6) cap.textContent = "do not move. it's almost got the mouth.";
  if (reveal > .85) cap.innerHTML = (Hell.name === "you" ? "hello." : "hello, " + Hell.name + ".") + "<br><span class=\"mono\">01011001 01001111 01010101</span>";
  requestAnimationFrame(frame);
}
frame();

</script>
</body>
</html>
