<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>666</title>
<link rel="stylesheet" href="hell.css">
</head>
<body data-page="countdown" class="cube">

<main class="wrap wide">
  <p class="xl r" id="clock">--:--:--</p>
  <p class="b" id="line">nothing happens when it reaches zero.<br>that is not the same as nothing.</p>
</main>
<div class="mini"><button id="snd" type="button">sound: off</button> &middot; esc</div>
<script src="hell.js"></script>
<script>

var target = Hell.S.first + 666 * 60000;
var clock = document.getElementById("clock");
var line = document.getElementById("line");
function tick() {
  var left = target - Date.now();
  if (left <= 0) {
    clock.textContent = "00:00:00";
    clock.className = "xl w shake";
    line.innerHTML = "IT IS TIME<br><span class='g'>YOU WERE GIVEN SIX HUNDRED AND SIXTY-SIX MINUTES</span><br><span class='r'>AND YOU SPENT THEM HERE</span>";
    if (!Hell.S.calledAt) { Hell.S.calledAt = Date.now(); Hell.save(); }
    return;
  }
  var s = Math.floor(left / 1000);
  clock.textContent = Hell.pad(Math.floor(s / 3600)) + ":" + Hell.pad(Math.floor(s / 60) % 60) + ":" + Hell.pad(s % 60);
}
tick();
setInterval(tick, 1000);

</script>
</body>
</html>
