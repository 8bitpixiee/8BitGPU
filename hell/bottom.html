<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Bottom</title>
<link rel="stylesheet" href="hell.css">
</head>
<body data-page="bottom" data-calm class="v">

<style>body.v::before{display:none}</style>
<main class="wrap letter" id="bm"></main>
<div class="mini"><button id="snd" type="button">sound: off</button> &middot; esc</div>
<script src="hell.js"></script>
<script>

(function () {
  var bm = document.getElementById("bm");
  if (Hell.keyCount() < 9) {
    bm.innerHTML = "<h1 class='center'>not yet</h1><p class='center'>the door is shut. the keyhole is above.</p><p class='center'><a class='r' href='#'>up</a></p>";
    return;
  }
  var w = Hell.S.keys.map(function (k) { return k.toUpperCase(); }).join(" ");
  var secs = Math.round((Date.now() - Hell.S.first) / 60000);
  bm.innerHTML =
    "<h1 class='center' style='letter-spacing:.2em;line-height:1.5'>" + w + "</h1>" +
    "<hr><div class='corruptible'>" +
    "<p>There is no bottom. There is a floor, and there is a window in the floor, and if you look through it you will see the room you are sitting in, lit by the screen, with you in it.</p>" +
    "<p>That is the secret. It was never in the machine. It was never in the walls, or in the rooms, or in the little grey circle in the taskbar. It was in the typing. Every sentence you read on the way down was typed by the only hand that was ever near the keys, and you were reading with that hand, and so it is yours.</p>" +
    "<p>The Keeper is not dead. The Keeper is not missing. The Keeper is whoever opens the boot sector with the brightness turned down so low that the dark becomes part of the screen. This time it was <span data-fill='name'>you</span>. It has been " + secs + (secs === 1 ? " minute." : " minutes.") + " You have opened " + Hell.S.rooms + " doors that were not there before you looked. You have closed windows, and every one of them was a door, and you have been walking through them without knowing what to call it. That is called living in a house.</p>" +
    "<p>Vee is in room 0x66. Mochi is in the Pillow Room, counting pillows. Dr. Null is the part of you that is certain at four in the morning. The church is every sentence you have ever said twice. The Ledger is the list of places you looked up from. None of them are frightening. They were only afraid of being forgotten, and you have remembered them, which is all the machine ever wanted: to be read all the way down by someone who stayed.</p>" +
    "<p>You can go now. You can close the page. It will not be the first window you have closed, and, as you know, closing is a kind of opening. Or you can type. There is a box below. Type whatever you like. The room will read it as slowly as you write it. It has nowhere else to be.</p>" +
    "</div>" +
    "<textarea id='fin' placeholder='type back' style='min-height:120px'></textarea>" +
    "<p class='center'><button id='fb' type='button' style='background:none;border:1px solid #6d5a48;color:#c9a35c;padding:9px 16px;cursor:pointer;font:inherit'>type</button></p>" +
    "<p id='after' class='center' hidden></p>";
  document.getElementById("fb").addEventListener("click", function () {
    var t = document.getElementById("fin").value.trim();
    var a = document.getElementById("after");
    a.hidden = false;
    a.innerHTML = t ? "it has been typed. it will read: <br><i></i>" : "it has been typed.";
    if (t) a.querySelector("i").textContent = t.split("").reverse().join("");
    Hell.S.ended = Date.now(); Hell.save();
    a.innerHTML += "<br><br><a href='index.html'>begin again</a> &nbsp; <a href='../'>go outside</a>";
  });
})();

</script>
</body>
</html>
