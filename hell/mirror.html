<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mirror</title>
<link rel="stylesheet" href="hell.css">
</head>
<body data-page="mirror" data-calm class="v">

<main class="wrap">
  <h1>Mirror</h1>
  <div class="cols">
    <textarea id="you" placeholder="type here" spellcheck="false"></textarea>
    <div class="mirrorpane" id="me"></div>
  </div>
  <p class="dim" id="mn"></p>
</main>
<div class="mini"><button id="snd" type="button">sound: off</button> &middot; esc</div>
<script src="hell.js"></script>
<script>

var you = document.getElementById("you");
var me = document.getElementById("me");
var note = document.getElementById("mn");
var lies = ["i am", "not you", "let me", "in", "behind", "glass", "your turn", "hold still", "same", "more", "mine"];
var taken = false;
you.addEventListener("input", function () {
  if (taken) return;
  var v = you.value;
  if (v.length < 12) { me.textContent = v; return; }
  var chars = v.split("");
  for (var i = 0; i < chars.length; i++) if (Math.random() < .06 && chars[i] !== " ") chars[i] = "█";
  me.textContent = chars.join("");
  if (v.length > 30 && !taken) {
    taken = true;
    note.textContent = "it is finishing the sentence.";
    you.readOnly = true;
    var s = v, k = 0;
    var tail = "  ...i have it now. you can stop. you can stop typing as me. ";
    var id = setInterval(function () {
      if (k >= tail.length) { clearInterval(id); note.innerHTML = (Hell.name === "you" ? "it was never your handwriting." : "it was never your handwriting, " + Hell.name + ".") + "<br><b style=\"color:#fff;font-size:44px;letter-spacing:.3em\">YOU</b>"; return; }
      s += tail[k++];
      you.value = s;
      me.textContent = s;
    }, 90);
  }
});

</script>
</body>
</html>
