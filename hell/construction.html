<script>

var g = document.getElementById("g");
for (var i = 0; i < 28; i++) {
  var a = Hell.makeLink("");
  var im = document.createElement("img");
  im.src = Hell.IMGS[Hell.rint(Hell.IMGS.length)];
  im.alt = "";

  a.append(im);
  g.append(a);
}
