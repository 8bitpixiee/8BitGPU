<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Guestbook</title>
<link rel="stylesheet" href="hell.css">
</head>
<body data-page="guestbook" data-calm class="t-f">

<main class="p-wrap" data-calm>
  <h1 class="center" style="letter-spacing:0">GUESTBOOK</h1>
  <form id="f" class="nolink" style="max-width:520px;margin:0 auto 30px">
    <input type="text" id="who" placeholder="your name (optional)"><br><br>
    <textarea id="msg" placeholder="say something"></textarea><br>
    <button type="submit">SIGN</button>
  </form>
  <div id="entries"></div>
</main>
<div class="mini"><button id="snd" type="button">sound: off</button> &middot; esc</div>
<script src="hell.js"></script>
<script>

var E = [
  ["mochi.exe","03:12","i saw the dock move. i was not touching the mouse"],
  ["VEE","03:13","nice site. why is it behind me"],
  ["Kit","03:40","i signed this already. it is still in my handwriting. it is better than mine"],
  ["anon","04:04","(this entry has been removed by the guestbook)"],
  ["pixie_4412","04:44","hi"],
  ["somebody","04:44","hi."],
  ["the room","--:--","we are glad you came. please do not sign twice. you will want to."],
  ["aaaaaaaaaaa","05:05","nine nine nine nine nine nine nine nine nine nine nine nine nine nine nine nine"],
  ["moonpool","05:21","DOOR 255. IS THAT WHERE I KNOW IT FROM. HELLO??"],
  ["D4RKM4TTER","06:06","666 lol"],
  ["(blank)","06:06","666 lol"]
];
var box = document.getElementById("entries");
function add(n, t, m, mine) {
  var d = document.createElement("p");
  d.style.borderTop = "1px solid #000";
  d.style.paddingTop = "8px";
  var b = document.createElement("b"); b.textContent = n + " ";
  var s = document.createElement("small"); s.textContent = "[" + t + "] ";
  d.append(b, s, document.createTextNode(m));
  if (mine) d.style.background = "#fdd";
  box.insertBefore(d, box.firstChild);
}
E.forEach(function (e) { add(e[0], e[1], e[2]); });
document.getElementById("f").addEventListener("submit", function (ev) {
  ev.preventDefault();
  var w = document.getElementById("who").value.trim() || Hell.name;
  var m = document.getElementById("msg").value.trim() || "...";
  var rev = m.split("").reverse().join("");
  add(w, Hell.clock(), rev + "   (edited by the room: it was easier to read this way)", true);
  document.getElementById("msg").value = "";
});

</script>
</body>
</html>
