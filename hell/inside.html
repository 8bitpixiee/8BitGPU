<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title></title>
<link rel="stylesheet" href="hell.css">
</head>
<body data-page="inside" data-calm class="v">
<canvas id="c" style="position:fixed;inset:0;width:100vw;height:100vh;display:block"></canvas>
<div class="mini"><button id="snd" type="button">sound: off</button> &middot; esc</div>
<script src="hell.js"></script>
<script>

(function () {
  var c = document.getElementById("c");
  var g = c.getContext("2d");
  var SW = 1600, SH = 900;
  var scale = 1, ox = 0, oy = 0;
  function fit() {
    c.width = innerWidth; c.height = innerHeight;
    scale = Math.max(c.width / SW, c.height / SH);
    ox = (c.width - SW * scale) / 2; oy = (c.height - SH * scale) / 2;
  }
  fit(); addEventListener("resize", fit);
  document.body.style.overflow = "hidden";
  document.body.style.margin = "0";

  var srcs = { woe: "../assets/hell/banner.png", skull: "../assets/hell/skull-big.png", star: "../assets/hell/pentagram.png", pix: "../assets/media/pixilart%20pixie.png", ghost: "../assets/decor/halloween/ghost.png", bat: "../assets/decor/halloween/bat.png", pump: "../assets/decor/halloween/pumpkin.png", void1: "../assets/avatar/voidling_f.png", void2: "../assets/avatar/voidling_m.png" };
  var im = {}, left = Object.keys(srcs).length;
  Object.keys(srcs).forEach(function (k) {
    var i = new Image();
    i.onload = i.onerror = function () { if (--left === 0) go(); };
    i.src = srcs[k];
    im[k] = i;
  });

  var mx = SW / 2, my = SH / 2, regions = [], eyes = [], t0 = Date.now();
  function toStage(e) { return [(e.clientX - ox) / scale, (e.clientY - oy) / scale]; }
  function inside(r, x, y) { return x > r.x && x < r.x + r.w && y > r.y && y < r.y + r.h; }
  function hit(x, y) { for (var i = regions.length - 1; i >= 0; i--) if (inside(regions[i], x, y)) return regions[i]; return null; }
  c.addEventListener("mousemove", function (e) { var p = toStage(e); mx = p[0]; my = p[1]; c.style.cursor = hit(mx, my) ? "pointer" : "crosshair"; });
  c.addEventListener("click", function (e) {
    var p = toStage(e), r = hit(p[0], p[1]);
    if (r) location.href = Hell.target();
  });

  function addEye(x, y, r) { eyes.push({ x: x, y: y, r: r, bl: 0 }); }
  var seeded = Hell.mulberry(31337);
  var skullMask = null;
  function go() {
    // crop the title off and feather the edges so the skull floats instead of sitting in a box
    skullMask = document.createElement("canvas");
    skullMask.width = 420; skullMask.height = 350;
    var m = skullMask.getContext("2d");
    m.imageSmoothingEnabled = false; m.drawImage(im.skull, 0, 0, 160, 140, 0, 0, 420, 350);
    var fade = m.createRadialGradient(210, 175, 70, 210, 175, 205);
    fade.addColorStop(0, "rgba(0,0,0,1)"); fade.addColorStop(1, "rgba(0,0,0,0)");
    m.globalCompositeOperation = "destination-in";
    m.fillStyle = fade; m.fillRect(0, 0, 420, 350);
    // eyes: dense cluster in the sky, a ring around the skull, and some in the corridor
    for (var i = 0; i < 38; i++) {
      var x = seeded() * SW, y = seeded() * 520;
      if (x > 470 && x < 1130 && y > 40 && y < 640) continue;
      addEye(x, y, 14 + seeded() * 30);
    }
    for (var j = 0; j < 14; j++) addEye(60 + seeded() * 1480, 560 + seeded() * 300, 8 + seeded() * 14);
    setInterval(function () { if (eyes.length < 120) addEye(seeded() * SW, seeded() * SH, 8 + seeded() * 26); }, 3500);
    requestAnimationFrame(draw);
  }

  var drifters = [
    { k: "ghost", x: 90, y: 150, s: 170, f: "invert(1)" }, { k: "bat", x: 1330, y: 110, s: 140, f: "" },
    { k: "pump", x: 1380, y: 640, s: 150, f: "hue-rotate(250deg) saturate(.4) brightness(.6)" },
    { k: "void1", x: 120, y: 520, s: 230, f: "contrast(1.4) brightness(.7)" }, { k: "void2", x: 1180, y: 330, s: 210, f: "invert(1) contrast(1.3)" }
  ];
  var pixies = [
    { x: 270, y: 300, w: 120, h: 360, r: -.05, f: "invert(1)" }, { x: 1180, y: 520, w: 300, h: 100, r: .1, f: "hue-rotate(160deg) contrast(1.6)" },
    { x: 780, y: 610, w: 90, h: 90, r: Math.PI, f: "" }, { x: 20, y: 760, w: 220, h: 140, r: .03, f: "brightness(.35)" }
  ];

  function door(side, depth) {
    var s = Math.pow(.62, depth);
    var vx = 800, vy = 650;
    var w = 150 * s, h = 360 * s;
    var x = side < 0 ? vx - 560 * s - w : vx + 560 * s;
    var y = vy - h + 60 * s;
    return { x: x, y: y, w: w, h: h, s: s };
  }

  function draw() {
    regions = [];
    var t = (Date.now() - t0) / 1000;
    g.setTransform(scale, 0, 0, scale, ox, oy);
    g.filter = "none";
    g.fillStyle = "#050303"; g.fillRect(0, 0, SW, SH);
    // sky: the crosses, stretched wrong
    g.globalAlpha = .85;
    g.filter = "sepia(.4) brightness(.8) contrast(1.2)";
    g.drawImage(im.woe, 0, 0, SW, 520);
    g.filter = "none"; g.globalAlpha = 1;
    var sky = g.createLinearGradient(0, 380, 0, 560); sky.addColorStop(0, "rgba(5,3,3,0)"); sky.addColorStop(1, "#050303");
    g.fillStyle = sky; g.fillRect(0, 380, SW, 200);
    regions.push({ x: 1150, y: 20, w: 330, h: 440 }); // the big cross
    regions.push({ x: 900, y: 240, w: 100, h: 200 });
    regions.push({ x: 200, y: 330, w: 230, h: 170 });
    // the pentagram, upside down, turning very slowly
    g.save(); g.translate(1330, 230); g.rotate(Math.PI + Math.sin(t * .2) * .15); g.globalAlpha = .35; g.globalCompositeOperation = "lighter"; g.drawImage(im.star, -110, -110, 220, 220); g.restore();
    g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
    regions.push({ x: 1220, y: 120, w: 220, h: 220 });
    // corridor of doors
    g.fillStyle = "#0b0605"; g.beginPath(); g.moveTo(0, SH); g.lineTo(800, 650); g.lineTo(SW, SH); g.fill();
    g.fillStyle = "#120808"; g.beginPath(); g.moveTo(0, 520); g.lineTo(800, 650); g.lineTo(0, SH); g.fill();
    g.beginPath(); g.moveTo(SW, 520); g.lineTo(800, 650); g.lineTo(SW, SH); g.fill();
    for (var d = 0; d < 8; d++) for (var side = -1; side <= 1; side += 2) {
      var D = door(side, d);
      g.fillStyle = "#020101"; g.fillRect(D.x, D.y, D.w, D.h);
      g.strokeStyle = "#4a2f18"; g.lineWidth = Math.max(1, 6 * D.s); g.strokeRect(D.x, D.y, D.w, D.h);
      if ((d * 3 + (side > 0 ? 1 : 0)) % 5 === 2) { g.fillStyle = "rgba(255,240,200," + (.25 + .2 * Math.sin(t * 2 + d)) + ")"; g.fillRect(D.x + D.w * .4, D.y, D.w * .2, D.h); }
      regions.push({ x: D.x, y: D.y, w: D.w, h: D.h });
    }
    // something stands at the end of the hall and is slightly closer each time
    var near = Math.min(1, (Hell.S.rooms + 1) / 20);
    g.fillStyle = "#000"; var fh = 70 + 80 * near; g.fillRect(795, 650 - fh, 12, fh); g.fillRect(793, 650 - fh - 14, 16, 16);
    // the skull
    var br = 1 + Math.sin(t * .6) * .015;
    g.save(); g.translate(800, 340); g.scale(br, br);
    g.globalCompositeOperation = "screen"; g.globalAlpha = .9; g.filter = "contrast(1.15) saturate(.8)";
    g.drawImage(skullMask, -330, -275, 660, 550);
    g.restore(); g.filter = "none"; g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
    regions.push({ x: 640, y: 240, w: 135, h: 160 }); // left socket
    regions.push({ x: 820, y: 240, w: 140, h: 160 }); // right socket
    regions.push({ x: 760, y: 410, w: 80, h: 85 });  // nose / mouth
    regions.push({ x: 700, y: 535, w: 220, h: 70 });
    // the pixies, stretched
    pixies.forEach(function (p) {
      g.save(); g.translate(p.x + p.w / 2, p.y + p.h / 2); g.rotate(p.r + Math.sin(t + p.x) * .02); g.filter = p.f || "none";
      g.drawImage(im.pix, -p.w / 2, -p.h / 2, p.w, p.h); g.restore(); g.filter = "none";
      regions.push({ x: p.x, y: p.y, w: p.w, h: p.h });
    });
    drifters.forEach(function (o, i) {
      var dx = Math.sin(t * .3 + i) * 30, dy = Math.cos(t * .25 + i * 2) * 18;
      g.filter = o.f || "none"; g.globalAlpha = .8;
      g.drawImage(im[o.k], o.x + dx, o.y + dy, o.s, o.s);
      g.filter = "none"; g.globalAlpha = 1;
      regions.push({ x: o.x + dx, y: o.y + dy, w: o.s, h: o.s });
    });
    // eyes
    eyes.forEach(function (e) {
      if (Math.random() < .003) e.bl = 6;
      var lid = e.bl > 0 ? e.bl-- : 0;
      var h = e.r * .55 * (lid ? .12 : 1);
      g.fillStyle = "#d8d0b8"; g.beginPath(); g.ellipse(e.x, e.y, e.r, h, 0, 0, 7); g.fill();
      var a = Math.atan2(my - e.y, mx - e.x), dd = Math.min(e.r * .45, Math.hypot(mx - e.x, my - e.y) / 8);
      g.fillStyle = "#400"; g.beginPath(); g.ellipse(e.x + Math.cos(a) * dd, e.y + Math.sin(a) * dd * .5, e.r * .34, Math.max(.5, h * .85), 0, 0, 7); g.fill();
      g.fillStyle = "#000"; g.beginPath(); g.arc(e.x + Math.cos(a) * dd, e.y + Math.sin(a) * dd * .5, Math.max(.8, e.r * .12), 0, 7); g.fill();
      regions.push({ x: e.x - e.r, y: e.y - e.r * .6, w: e.r * 2, h: e.r * 1.2 });
    });
    // static along the floor and the odd tear
    for (var n = 0; n < 220; n++) { g.fillStyle = "rgba(255,255,255," + (Math.random() * .22).toFixed(2) + ")"; g.fillRect(Math.random() * SW, 840 + Math.random() * 60, 3, 2); }
    g.setTransform(1, 0, 0, 1, 0, 0);
    // vignette
    var v = g.createRadialGradient(c.width / 2, c.height / 2, c.height * .35, c.width / 2, c.height / 2, c.height * .95);
    v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.8)");
    g.fillStyle = v; g.fillRect(0, 0, c.width, c.height);
    requestAnimationFrame(draw);
  }
})();

</script>
</body>
</html>
