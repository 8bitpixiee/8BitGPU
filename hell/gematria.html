<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gematria of Your Name</title>
<link rel="stylesheet" href="hell.css">
</head>
<body data-page="gematria" data-calm class="cube">

<main class="wrap">
  <p class="g">THE NUMBER OF YOUR NAME</p>
  <p class="sm"><input id="nm" type="text" placeholder="type your name" autocomplete="off" style="max-width:420px;text-align:center"></p>
  <p class="xl w" id="sum">?</p>
  <p class="y" id="msg">&nbsp;</p>
  <p class="sm dim">8BitGPU = 83. 8 + 3 = 11. 1 + 1 = 2.</p>
</main>
<div class="mini"><button id="snd" type="button">sound: off</button> &middot; esc</div>
<script src="hell.js"></script>
<script>

var nm = document.getElementById("nm");
var sum = document.getElementById("sum");
var msg = document.getElementById("msg");
if (Hell.name !== "you") nm.value = Hell.name;
function calc() {
  var t = 0;
  nm.value.toUpperCase().split("").forEach(function (c) { var v = c.charCodeAt(0) - 64; if (v >= 1 && v <= 26) t += v; });
  if (!t) { sum.textContent = "?"; return; }
  sum.textContent = t;
  if (t === 1) { msg.innerHTML = "<span class=\"w\" style=\"font-size:72px\">A</span>"; return; }
  var r = t;
  while (r > 9) r = String(r).split("").reduce(function (a, b) { return a + +b; }, 0);
  if (t % 6 === 0) msg.innerHTML = "DIVISIBLE BY SIX.<br><span class='r'>IT HAD YOUR NAME BEFORE YOU DID.</span>";
  else msg.innerHTML = "OFF BY " + (6 - (t % 6)) + " FROM THE NEAREST SIX-FOLD.<br><span class='r'>IT IS LEAVING ROOM FOR " + (6 - (t % 6)) + " MORE OF YOU.</span><br><span class='b'>REDUCED: " + r + "</span>";
}
nm.addEventListener("input", calc);
calc();

</script>
</body>
</html>
