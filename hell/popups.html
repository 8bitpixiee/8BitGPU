<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>p i x e l . w o r l d . d i s o r d e r</title>
<link rel="stylesheet" href="hell.css">
</head>
<body data-page="popups" class="t-e">

<main class="wrap center">
  <p class="spaced">p i x e l . w o r l d . d i s o r d e r</p>
  <p class="spaced dim">a s y m m e t r i c . w i n d o w . a n a l y s i s</p>
  <p><a href="#" id="spawn">THE BULL OF INDICTION</a></p>
  <p><small><button id="closeall" type="button" class="mono" style="background:none;border:1px solid #3a2a1a;color:#9aa;padding:6px 10px;cursor:pointer">close all (0)</button></small></p>
</main>
<div class="mini"><button id="snd" type="button">sound: off</button> &middot; esc</div>
<script src="hell.js"></script>
<script>

var words = ["INCARNATIONIS MYSTERIUM","you are window 1 of 1","IT HAS YOUR PIXEL","the cursor is a hand","SAY IT BACKWARDS","no one is in the dock","DO NOT CLOSE THE OTHER ONE","8 / 8 / 9","the pixie was never cute, you were tired","LET IT IN","you are the popup"];
var count = 0, wins = [], closes = 0;
var cap = 36;
function spawn() {
  if (wins.length >= cap) return;
  count++;
  var w = document.createElement("div");
  w.className = "fakewin";
  w.style.left = Math.random() * Math.max(10, innerWidth - 250) + "px";
  w.style.top = 20 + Math.random() * Math.max(10, innerHeight - 190) + "px";
  var h = document.createElement("header");
  var tt = document.createElement("span");
  tt.textContent = "pixel.exe (" + count + ")";
  var x = document.createElement("button");
  x.textContent = "x";
  x.setAttribute("aria-label", "close");
  h.append(tt, x);
  var d = document.createElement("div");
  d.textContent = words[Math.floor(Math.random() * words.length)];
  w.append(h, d);
  document.body.append(w);
  wins.push(w);
  x.addEventListener("click", function () {
    closes++;
    if (closes === 9) { var sw = document.createElement("div"); sw.className = "fakewin"; sw.style.left = "40%"; sw.style.top = "40%"; sw.innerHTML = "<header><span>pixel.exe</span></header><div><a href=\"#\" data-reveal=\"CLOSED\" style=\"font-size:30px;color:#a00\">CLOSED</a></div>"; document.body.append(sw); wins.push(sw); }
    w.remove();
    wins = wins.filter(function (q) { return q !== w; });
    spawn();
    spawn();
    document.getElementById("closeall").textContent = "close all (" + wins.length + ")";
  });
  document.getElementById("closeall").textContent = "close all (" + wins.length + ")";
}
document.getElementById("spawn").addEventListener("click", function (e) { e.preventDefault(); spawn(); spawn(); spawn(); });
document.getElementById("closeall").addEventListener("click", function () {
  var gone = wins.slice();
  wins = [];
  gone.forEach(function (w) { w.remove(); });
  document.getElementById("closeall").textContent = "close all (0)";
  var k = 0;
  var id = setInterval(function () {
    var w = document.createElement("div");
    w.className = "fakewin";
    w.style.left = Math.random() * Math.max(10, innerWidth - 250) + "px";
    w.style.top = 20 + Math.random() * Math.max(10, innerHeight - 190) + "px";
    w.innerHTML = "<header><span>you.exe</span></header><div>you closed them.<br>they closed you.</div>";
    document.body.append(w);
    wins.push(w);
    if (++k >= 6) clearInterval(id);
  }, 700);
});

</script>
</body>
</html>
