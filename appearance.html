<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Appearance</title>
    <link rel="stylesheet" href="client/shared/retro-windows.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 18px;
            background: var(--panel);
            color: var(--ink);
            font-size: 13px;
        }
        h1 { margin: 0 0 18px; font-size: 19px; }
        label { display: block; margin-bottom: 6px; }
        select, button {
            padding: 7px;
            background: var(--paper);
            color: var(--ink);
            border: 2px inset var(--panel);
        }
        select { width: 100%; }
        .sample {
            margin: 18px 0;
            padding: 16px;
            background: var(--paper);
            border: 2px inset var(--panel);
        }
        .sample p { line-height: 1.6; }
        button {
            background: var(--panel);
            border-style: outset;
            cursor: pointer;
        }
   body {
    padding: 22px;
    border: 3px outset var(--panel);
}

h1 {
    padding-bottom: 12px;
    border-bottom: 2px groove var(--panel);
    color: var(--ink);
}

label {
    font-weight: bold;
    margin-bottom: 9px;
}

select {
    min-height: 40px;
    padding: 8px 12px;
    border: 2px inset var(--panel);
    border-radius: 0;
    background: var(--paper);
    font-size: 15px;
}

select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
}

.sample {
    border: 3px inset var(--panel);
    padding: 18px;
    box-shadow: inset 1px 1px #00000018;
}

.sample strong {
    display: block;
    font-size: 21px;
    line-height: 1.4;
}

button {
    min-height: 34px;
    padding: 7px 12px;
    border: 2px outset var(--panel);
    box-shadow: 1px 1px #49364f;
}

button:active {
    border-style: inset;
    box-shadow: none;
}
#fontPicker {
    position: relative;
}

#fontPicker summary {
    padding: 10px 12px;
    background: var(--paper);
    color: var(--ink);
    border: 2px inset var(--panel);
    cursor: pointer;
    list-style: none;
    font-family: Tahoma, Arial, sans-serif !important;
}

#fontPicker summary::-webkit-details-marker {
    display: none;
}

#fontPicker .font-options {
    max-height: 230px;
    overflow-y: auto;
    margin-top: 4px;
    padding: 4px;
    border: 2px inset var(--panel);
    background: var(--paper);
}

#fontPicker .font-options button {
    display: block;
    width: 100%;
    min-height: 48px;
    padding: 12px;
    margin-bottom: 3px;
    text-align: left;
    font-size: 20px;
    line-height: 1.5;
    overflow-wrap: anywhere;
    box-shadow: none;
}

#fontPicker button:hover,
#fontPicker button:focus-visible,
#fontPicker button[aria-pressed="true"] {
    background: var(--edge);
    color: var(--title-ink);
}

#fontPickerLabel,
#resetFont {
    font-family: Tahoma, Arial, sans-serif !important;
}
   </style>
<link rel="stylesheet" href="client/shared/global-appearance.css">
</head>
<body>
    <h1>Make yourself at home.</h1>

    <label for="fontChoice">Desktop font</label>
    <select id="fontChoice">
        <option value="windows">Windows Classic — Tahoma</option>
        <option value="verdana">Soft &amp; readable — Verdana</option>
        <option value="mono">Terminal — Courier New</option>
        <option value="book">Storybook — Georgia</option>
        <option value="delius">♡ Sweet handwriting — Delius</option>
        <option value="cherry">☁ Bubblegum — Cherry Bomb One</option>
        <option value="pixel">✦ Pixie computer — Pixelify Sans</option>  
    </select>

    <div class="sample">
        <strong>Your little corner of the internet.</strong>
        <p>Avatar Lab · The Pillow Room · MyPixel</p>
        <small>ABCDEFGHIJKLMNOPQRSTUVWXYZ · 0123456789</small>
    </div>

    <button id="resetFont" type="button">Restore classic font</button>
    <p role="status">Changes save automatically in this browser.</p>

    <script src="client/shared/window-theme.js"></script>
  <script>
    const choice = document.getElementById("fontChoice");
    const fonts = window.desktopFonts;
    choice.hidden = true;

    const picker = document.createElement("details");
    picker.id = "fontPicker";

    const heading = document.createElement("summary");
    heading.id = "fontPickerHeading";

    const list = document.createElement("div");
    list.className = "font-options";

    picker.append(heading, list);
    choice.before(picker);

    const label = document.querySelector('label[for="fontChoice"]');
    label.removeAttribute("for");
    label.id = "fontPickerLabel";
    heading.setAttribute(
        "aria-labelledby",
        "fontPickerLabel fontPickerHeading"
    );

    function updateSelection() {
        const selected = window.getDesktopFont();
        const stack = fonts[selected] || fonts.windows;
        heading.textContent =
            stack.split(",")[0].replace(/'/g, "") + " ▾";

        list.querySelectorAll("button").forEach(button => {
            button.setAttribute(
                "aria-pressed",
                String(button.dataset.font === selected)
            );
        });
    }

    Object.entries(fonts).forEach(([key, stack]) => {
        const button = document.createElement("button");
        const name = stack.split(",")[0].replace(/'/g, "");

        button.type = "button";
        button.dataset.font = key;
        button.textContent = name + " · Aa 0123";

        // Override the shared font rule for this preview only.
        button.style.setProperty("font-family", stack, "important");

        button.addEventListener("click", () => {
            window.setDesktopFont(key);
            updateSelection();
            picker.open = false;
            heading.focus();
        });

        list.appendChild(button);
    });

    // Load previews when the dropdown is first opened.
    picker.addEventListener("toggle", () => {
        if (!picker.open || document.getElementById("fontPreviewSheet")) {
            return;
        }

        const builtIn = ["windows", "verdana", "mono", "book"];
        const families = Object.entries(fonts)
            .filter(([key]) => !builtIn.includes(key))
            .map(([, stack]) => stack.split(",")[0].replace(/'/g, ""));

        const sheet = document.createElement("link");
        sheet.id = "fontPreviewSheet";
        sheet.rel = "stylesheet";
        sheet.href = "https://fonts.googleapis.com/css2?" +
            families.map(name => "family=" + encodeURIComponent(name))
                .join("&") +
            "&display=swap";

        document.head.appendChild(sheet);
    });

    document.getElementById("resetFont").addEventListener("click", () => {
        window.setDesktopFont("windows");
        updateSelection();
    });

    picker.addEventListener("keydown", event => {
        if (event.key === "Escape") {
            picker.open = false;
            heading.focus();
        }
    });

    updateSelection();
</script>
<script src="client/shared/global-appearance.js"></script>
</body>
</html>
