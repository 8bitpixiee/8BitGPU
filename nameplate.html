<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nameplate & crystals</title><link rel="stylesheet" href="client/shared/badges.css"><link rel="stylesheet" href="client/shared/nameplates.css"><link rel="stylesheet" href="client/profile/nameplate-studio.css"></head><body>
<form id="nameplateForm"><header><h1>Nameplate & crystals</h1><small>Your own little signature.</small></header>
<div class="preview" aria-label="Nameplate preview"><span id="platePreview"></span></div>
<label class="title-label" for="plateTitle">Tiny title <span id="titleCount">0 / 28</span></label><input id="plateTitle" maxlength="28" autocomplete="off" placeholder="A little about you…" disabled>
<fieldset id="colorControls" disabled><legend>Plate colors</legend><label for="colorTarget" class="sr-only">Part to color</label><select id="colorTarget"><option value="background">Background</option><option value="border">Border</option><option value="name">Name</option><option value="title">Title</option></select>
<label for="h">Hue <output id="hValue"></output></label><input id="h" type="range" min="0" max="360">
<label for="s">Saturation <output id="sValue"></output></label><input id="s" type="range" min="0" max="100">
<label for="l">Lightness <output id="lValue"></output></label><input id="l" type="range" min="0" max="100"></fieldset>
<fieldset id="badgeControls" disabled><legend>Floating crystals</legend><p>Choose which of your badges appear. Hover a shard for its name.</p><div id="badgeChoices"></div></fieldset>
<footer><button id="resetPlate" type="button" disabled>Reset style</button><button id="savePlate" type="submit" disabled>Save</button></footer><p id="studioStatus" role="status">Loading your nameplate…</p></form>
<script src="client/shared/nameplates.js"></script><script src="client/shared/badges.js"></script><script src="client/profile/nameplate-studio.js"></script></body></html>
