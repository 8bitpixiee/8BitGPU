<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social</title><link rel="stylesheet" href="retro-windows.css"><link rel="stylesheet" href="social.css"></head><body class="social-page">
<nav aria-label="Social tabs"><button data-tab="friends">Friends</button><button data-tab="inbox">Notifications <span id="count"></span></button><button data-tab="top">My Top 8</button></nav>
<p id="status" role="status"></p>
<section id="friends"><form id="add"><label>Creature name <input id="name" required maxlength="18" autocomplete="off"></label><button>Send request</button></form><h2>Friend requests</h2><div id="requests"></div><h2>Friends</h2><div id="list"></div></section>
<section id="inbox" hidden><button id="read">Mark displayed notifications read</button><div id="events"></div></section>
<section id="top" hidden><h2>MyPixel Top 8</h2><p>Your public favorites, in your order. Choose up to eight accepted friends.</p><div id="slots"></div><button id="saveTop">Save Top 8</button></section>
<section id="conversation" hidden><h2 id="conversationTitle"></h2><div id="messages" aria-live="polite"></div><form id="send"><label>Message <textarea id="message" maxlength="1000" required></textarea></label><button>Send DM</button></form><label>Invite to <select id="room"><option value="arcade">Arcade Lounge</option><option value="chat">Chat.exe</option></select></label><button id="invite">Send room invite</button></section>
<script src="window-theme.js"></script><script src="social.js"></script></body></html>
