<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social</title><link rel="stylesheet" href="retro-windows.css"><link rel="stylesheet" href="social.css"></head><body class="social-page">
<main id="socialHome"><header class="social-header"><span>✦</span><div><strong>MyPixel Social</strong><small>your tiny internet corner</small></div><output id="unread"></output></header><p id="status" role="status"></p><section class="social-section"><header><h1>Friends</h1><button id="openTop" type="button">Top 8</button></header><form id="add"><input id="name" placeholder="Add a creature…" required maxlength="18"><button>+ Add</button></form><div id="requests"></div><div id="friends"></div></section><section class="social-section"><header><h1>Messages</h1></header><div id="conversations"></div></section><section class="social-section"><header><h1>Notifications</h1></header><div id="notifications"></div></section></main>
<main id="topEditor" hidden><header class="social-header"><span>★</span><div><strong>My Top 8</strong><small>your public MyPixel favorites</small></div></header><p>Choose up to eight accepted friends, in the order you want them shown.</p><div id="slots"></div><footer><button id="saveTop" type="button">Save Top 8</button><button id="closeTop" type="button">Back</button></footer></main>
<main id="dmWindow" hidden><header class="social-header"><button id="dmProfile" class="selfie" type="button"></button><div><strong id="dmName">DM</strong><small id="dmState">Offline</small></div><button id="dmInvite" type="button">Invite</button></header><div id="messages" aria-live="polite"></div><form id="send"><textarea id="message" maxlength="1000" placeholder="Write a message…"></textarea><button>Send</button></form><p class="key-tip">Enter sends · Shift + Enter adds a line</p></main>
<script src="window-theme.js"></script><script src="social.js"></script></body></html>
