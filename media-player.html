<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>8Bit Media Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="client/media/media-player.css">
<link rel="stylesheet" href="client/shared/retro-windows.css"></head>
<body>
    <main class="media-player">
        <section class="player-side">
            <div class="player-heading"><span class="live-dot"></span><strong>8BIT PIXIEE TV</strong><span>LIVE TRANSMISSION</span></div>
            <div class="twitch-screen">
                <iframe
                    id="twitch-player"
                    allowfullscreen="true"
                    allow="autoplay; fullscreen"
                    title="8Bit Pixiee Twitch stream"></iframe>
            </div>
            <p id="twitch-embed-status" role="status" hidden></p>
            <div class="player-controls">
                <span>◀◀</span><span>▶</span><span>▶▶</span>
                <div class="signal-meter"><i></i><i></i><i></i><i></i><i></i></div>
                <a href="https://www.twitch.tv/8bit_pixiee" target="_blank" rel="noreferrer">OPEN TWITCH ↗</a>
            </div>
        </section>

        <aside class="aol-chat">
            <header>TWITCH CHAT</header>
            <div class="buddy-bar">Community chat now has its own window: <a href="chat.html">Chat.exe ↗</a></div>
            <div class="chat-wrap">
                <iframe
                    id="twitch-chat"
                    title="8Bit Pixiee Twitch chat"></iframe>

            </div>
            <footer><span>TYPE A MESSAGE IN TWITCH CHAT</span><b>✦</b></footer>
        </aside>
    </main>

<script src="client/media/twitch-embed.js"></script>
<script src="client/shared/window-theme.js"></script></body>
</html>
